<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
  <!-- TRL film-grain tile. Referenced from motion.css as a tiling overlay that
       breaks up large flat gradients. Local file, not a data URI, so the
       static-site audit can verify it exists. -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#grain)" opacity="0.9"/>
</svg>
